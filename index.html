<style>
:root{color-scheme:light;--ink:#213832;--muted:#5c7068;--teal:#17665a;--line:#d9e3dd;font:15px/1.55 "PingFang HK","Microsoft JhengHei",Arial,sans-serif;color:var(--ink);background:#f6f8f6}
*{box-sizing:border-box}body{margin:0}.wrap{width:min(1080px,calc(100% - 48px));margin:auto}
header{background:#fff;border-bottom:1px solid var(--line)}.brand{height:66px;display:flex;align-items:center;gap:13px;font-weight:650}
.mark{background:#175d52;color:white;border-radius:5px;padding:6px 9px;letter-spacing:1px;font:700 13px/1.4 Arial,sans-serif}
main{padding:20px 0 48px}.tools,.project-head,.row,.buttons{display:flex;align-items:center;gap:12px}.tools{gap:8px;flex-wrap:wrap}h1,h2,h3,h4,p{margin:0}.brand h1{font-size:16px;line-height:1.4;font-weight:650}button,input,select{font:inherit;color:inherit}
button{cursor:pointer}.tool,.action{border:1px solid #c6d5cd;border-radius:7px;background:#fff;padding:8px 13px;font-size:14px;font-weight:550}button:hover,.tool:hover{background:#edf3ef}.primary{background:var(--teal);border-color:var(--teal);color:white}.primary:hover{background:#104f45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c38833;outline-offset:3px}
.tabs{display:flex;overflow:auto;border-bottom:1px solid #cedbd3;gap:20px;margin:0 0 28px}.tab{border:0;border-bottom:3px solid transparent;background:none;padding:9px 5px 10px;white-space:nowrap;color:var(--muted);font-weight:600}.tab[aria-selected=true]{color:var(--teal);border-bottom-color:var(--teal)}.badge{font:500 12px/1.4 Arial,sans-serif;background:#e8eee9;border-radius:10px;padding:2px 7px;margin-left:7px}
.project+.project{margin-top:32px}.project-head{margin:0 0 11px;gap:10px}.project-head h2{font-size:23px}.project-head span,.meta{color:var(--muted);font-size:13px}
.group{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin:10px 0 16px}.group h3{display:flex;align-items:center;gap:9px;padding:10px 18px;font-size:15px;font-weight:600;background:#eef3ef;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.group h3::before{content:"";width:4px;height:14px;border-radius:3px;background:#69a593;flex:none}
.row{padding:13px 18px;gap:17px}.row+.row{border-top:1px solid var(--line)}.thumb{width:90px;height:62px;object-fit:contain;display:grid;place-items:center;flex:none;border-radius:5px;background:#eef3f0;border:1px solid #dae3dd;color:var(--teal);font:600 12px/1.2 monospace}.label{min-width:0;flex:1}.label h4{font-size:17px;overflow-wrap:anywhere}.open{color:var(--teal);font-size:14px;font-weight:650;text-underline-offset:4px;white-space:nowrap}.foot{margin-top:20px;color:var(--muted);font-size:13px}.foot p+p{margin-top:4px}#notice{margin-top:14px;color:var(--teal);font-size:14px}#notice:empty{display:none}
dialog{width:min(460px,calc(100% - 32px));border:1px solid var(--line);padding:24px;border-radius:14px;box-shadow:0 18px 70px #173e302a;color:var(--ink)}dialog::backdrop{background:#172c2761}dialog h2{font-size:23px}.fileinfo{font-size:13px;color:var(--muted);margin:4px 0 16px;overflow-wrap:anywhere}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}dialog input,dialog select{width:100%;padding:9px;border:1px solid #bfcdc5;background:white;border-radius:6px}.new-name{margin-top:7px}.buttons{margin-top:22px;justify-content:flex-end}.project-head h2{overflow-wrap:anywhere;min-width:0}.project-head span{white-space:nowrap}[hidden]{display:none!important}
@media(max-width:620px){.wrap{width:calc(100% - 32px)}main{padding:28px 0}.tab{padding:8px 2px}.tabs{margin:0 0 18px}.row{padding:12px;gap:10px;flex-wrap:wrap}.thumb{width:64px;height:46px}.open{font-size:13px}.tool{font-size:13px}.meta{font-size:12px}}

<script type="application/json" id="catalog">[{"file":"MLP1/MLP1_FWB.html","project":"MLP1","section":"Master(without align DS)","title":"RM - 2026 Nov","updated":"2026-11-25"},{"file":"MLP1/ContactCenter.html","project":"MLP1","section":"Contact Center","title":"4 Interview Tasks","updated":"2026-11-26"},{"file":"MLP4/MLP4_Flow_Map.html","project":"MLP4","section":"Flow Map","title":"MLP4 投資銷售流程 As-Is","updated":"2026-11-17"},{"file":"MLP6/PPM_prototype.html","project":"MLP6","section":"PPM","title":"FWB 投資組合分析 Prototype","updated":"2026-10-16"},{"file":"DesignSystem/Accordion_Table.html","project":"Design System","section":"Component Prototype","title":"Accordion Table","updated":"2026-10-14"},{"file":"DesignSystem/Tabs_Dropdown.html","project":"Design System","section":"Component Prototype","title":"Tabs Dropdown","updated":"2026-10-12"}]</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const entries = JSON.parse($('catalog').textContent);
let activeProject = null;
const sortNames = (a,b) => a.localeCompare(b,'zh-HK',{numeric:true});
const distinct = values => [...new Set(values)].sort(sortNames);
const projects = () => distinct(entries.map(entry => entry.project));
const sections = project => distinct(entries.filter(entry => entry.project === project).map(entry => entry.section));
function element(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
const thumbnails = new Map(Array.from(document.querySelectorAll('template[data-thumbnail]'), template => [template.dataset.thumbnail,template.content]));
function row(entry) {
  const item = element('article','row');
  const thumb = thumbnails.get(entry.file)?.cloneNode(true) ?? element('span','thumb','HTML');
  const label = element('div','label');
  const date = element('time','',entry.updated);
  date.dateTime = entry.updated;
  const meta = element('p','meta','最近更新 ');
  meta.append(date);
  label.append(element('h4','',entry.title),meta);
  const link = element('a','open','開啟原型 →');
  link.href = './' + entry.file.split('/').map(encodeURIComponent).join('/');
  link.setAttribute('aria-label','開啟 ' + entry.title);
  item.append(thumb,label,link);
  return item;
}
function selectProject(name, focus) {
  activeProject = name;
  render();
  if (focus) $('tabs').querySelector('[aria-selected=true]').focus();
}
function render() {
  const names = projects();
  if (!names.includes(activeProject)) activeProject = null;
  $('tabs').replaceChildren();
  for (const [i,name] of [null,...names].entries()) {
    const tab = element('button','tab',name ?? 'All');
    const count = name === null ? entries.length : entries.filter(entry => entry.project === name).length;
    tab.append(element('span','badge',count));
    tab.id = 'projectTab-' + i;
    tab.setAttribute('role','tab');
    tab.setAttribute('aria-controls','panel');
    tab.setAttribute('aria-selected',name === activeProject);
    tab.tabIndex = name === activeProject ? 0 : -1;
    tab.onclick = () => selectProject(name,true);
    $('tabs').append(tab);
    if (name === activeProject) $('panel').setAttribute('aria-labelledby',tab.id);
  }
  $('panel').replaceChildren();
  for (const name of activeProject === null ? names : [activeProject]) {
    const project = element('section','project');
    const heading = element('div','project-head');
    const groupNames = sections(name);
    heading.append(element('h2','',name),element('span','',groupNames.length+' 個 Section'));
    project.append(heading);
    for (const groupName of groupNames) {
      const group = element('section','group');
      group.append(element('h3','',groupName));
      const items = entries.filter(entry => entry.project === name && entry.section === groupName);
      items.sort((a,b) => b.updated.localeCompare(a.updated) || sortNames(a.title,b.title));
      group.append(...items.map(row));
      project.append(group);
    }
    $('panel').append(project);
  }
}
$('tabs').onkeydown = event => {
  const tabs = [...$('tabs').children], current = tabs.indexOf(document.activeElement);
  const positions = {ArrowLeft:(current+tabs.length-1)%tabs.length,ArrowRight:(current+1)%tabs.length,Home:0,End:tabs.length-1};
  if (Object.hasOwn(positions,event.key)) { event.preventDefault(); tabs[positions[event.key]].click(); }
};

render();
</script>
