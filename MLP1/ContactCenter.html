>\n\u003cnav id=\"rail\" aria-label=\"主導覽\">\u003c/nav>\u003caside id=\"fly\" aria-label=\"子選單\" hidden>\u003c/aside>\n\u003cdiv id=\"app\">\u003cheader>\u003cdiv id=\"heading\">\u003ch1>\u003c/h1>\u003cspan id=\"date\">星期一&nbsp; 2026/01/01\u003c/span>\u003c/div>\u003cdiv class=\"spacer\">\u003c/div>\n\u003cform id=\"search\" role=\"search\">\u003cselect id=\"kind\" aria-label=\"客戶類別\">\u003coption>個人客戶\u003c/option>\u003c/select>\u003cinput id=\"query\" type=\"search\" autocomplete=\"off\" aria-label=\"搜尋客戶\" placeholder=\"搜尋客戶\">\u003cspan class=\"keys\">\u003ckbd>Ctrl\u003c/kbd>\u003ckbd>E\u003c/kbd>\u003c/span>\u003cbutton class=\"searchgo\" aria-label=\"提交搜尋\">\u003ci class=\"magnify\">\u003c/i>\u003c/button>\u003cdiv id=\"recent\" class=\"popup recent\" hidden>\u003c/div>\u003c/form>\n\u003cbutton class=\"account\" id=\"account\" aria-label=\"用戶選單\" aria-expanded=\"false\">\u003c/button>\u003cdiv class=\"popup accountbox\" id=\"accountbox\" hidden>\u003c/div>\u003c/header>\n\u003cdiv id=\"profile-alert\" role=\"status\" hidden>\u003cspan class=\"figicon fig-AlertInfo\" aria-hidden=\"true\">\u003c/span>客戶選擇退出 C-44 (同意使用存款資料)，存款資料會被隱藏。\u003c/div>\u003cmain id=\"main\">\u003c/main>\u003c/div>\u003cdialog id=\"modal\" aria-labelledby=\"dialogtitle\">\u003c/dialog>\u003cdialog id=\"missing-dialog\" aria-labelledby=\"missing-title\">\u003cdiv class=\"modalbody\">\u003ch2 id=\"missing-title\">沒有此screen design\u003c/h2>\u003c/div>\u003cform method=\"dialog\" class=\"actions\">\u003cbutton class=\"secondary-btn\">關閉\u003c/button>\u003c/form>\u003c/dialog>\u003cdiv id=\"starTip\" role=\"tooltip\" hidden>\u003c/div>\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript>const $=id=>document.getElementById(id);\nconst h=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst ic=(s,sm=false)=>`\u003ci class=\"ic ${s}${sm?' icon-small':''}\" aria-hidden=\"true\">\u003c/i>`;\nconst chevron=(tiny=false)=>`\u003ci class=\"chev ${tiny?'tiny':''}\" aria-hidden=\"true\">\u003c/i>`;\nconst btn=(label,act,val='',cls='')=>`\u003cbutton type=\"button\" class=\"${cls}\" data-act=\"${act}\" data-val=\"${h(val)}\">${label}\u003c/button>`;\nconst nav=['首頁','我的客盤','客戶挖潛','銷售線索','商機','活動','客盤動態','跟進客戶名單','其他系統'];\nconst navIcons=['home','users','discover','leads','opps','calendar','signals','follow','others'];\nconst menus={商機:['進行中','過往商機'],活動:['預約活動','活動記錄','活動草稿'],其他系統:['人員資料庫','外匯報價指示','培訓模式']};\nconst tabs=['Must Do','行銷活動','分行行銷活動','自設客戶列表'];\nconst people=[\n ['譚玉瑛 Tam Yuk Ying','8109572634'],['吳嘉麗 Ng Ga Lai','6910438572'],['吳浩康 Ng Hou Hong','7200245714'],['羅樂林 Lo Lok Lam','2384769150'],['萬梓良 Maan Ji Leung','3576948012'],['林憶蓮 Lam Yik Lin Sandy','5071634892'],['鄭子誠 Jeng Ji Sing','9140823657'],\n ['李美玲 Lee Mei Ling','8109572634'],['吳國偉 Ng Kwok Wai','8109572634'],['萬梓良 Man Tze Leung','8109572634'],['蘇玉華 So Yuk Wa','7410438572'],['吳浩康 Ng Hou Hong','64738298'],\n ['謝君豪 Tse Kwan Ho','7632915480'],['黃德斌 Wong Tak Ban','1056723894'],['許鞍華 Ann Hui','8726345190'],['莊文強 Felix Chong','5710983462'],['歐陽震華 Au Yeung Jan Wa','4836701295']\n];\nconst roles=[['吳家明','31890','客戶經理'],['歐家豪','29834','客戶經理'],['郭小英','23059','客戶經理助理'],['張儀文','37284','客戶經理助理']];\nconst events=['與李美玲通話','與吳國偉面談','與萬梓良騰訊會議'];\nconst signals=['定期單到期','客戶生日','QIP 將於兩星期後到期','跨境企業客戶在港使用提款卡/信用卡','RM Chat迎新推廣 -WM version','大額存款增加 (本日結餘 - 上日結餘 >= 1,000,000.00)','大額存款減少 (本日結餘 - 上日結餘 \u003c= 1,000,000.00)'];\nconst totals=[6,1,6,6,6,4,4];\nconst person=(i)=>`\u003cspan class=\"person\">\u003ci class=\"art ${[2,3,4,8,9,11,14].includes(i)?'sand':'pink'}\" aria-hidden=\"true\">\u003c/i>\u003cspan>\u003cb>${h(people[i][0])}\u003c/b>\u003cspan class=\"secondary\">#${people[i][1]}\u003c/span>\u003c/span>\u003c/span>`;\nconst avatar=(v)=>`\u003cspan class=\"badge\">${h(v)}\u003c/span>`;\nconst section=(title,icon,body,to,all='查看所有')=>`\u003csection class=\"section\">\u003cdiv class=\"sectionhead\">\u003ch2>${icon?ic(icon):''}${title}\u003c/h2>${to?btn(all+' '+chevron(true),'go',to,'viewall'):''}\u003c/div>${body}\u003c/section>`;\nconst emptyLine=t=>`\u003cdiv class=\"emptyline\">ⓘ　${t}\u003c/div>`;\nfunction activities(){\n if(state.home==='first')return emptyLine('沒有預約活動');\n const count=state.home==='busy'?7:3;\n return Array.from({length:count},(_,i)=>{\n  const n=Math.min(i,2);\n  return `\u003carticle class=\"activity\">\u003cdiv>\u003cspan class=\"topic\">${events[n]}\u003c/span>\u003cspan class=\"timepill\">${ic(n?'meeting':'phone',true)} 今天, 09:00\u003c/span>\u003c/div>${customerLink(n+7)}${btn(ic('activitynote',true)+' 建立活動記錄','record',i,'record')}\u003cbutton class=\"arrowbtn\" data-act=\"event\" data-val=\"${i}\" aria-label=\"查看${events[n]}\">${chevron()}\u003c/button>\u003c/article>`;\n }).join('');\n}\nfunction referrals(){\n if(state.home==='first')return emptyLine('沒有最近轉介');\n return Array.from({length:state.home==='busy'?7:1},()=>'\u003carticle class=\"refrow\">'+btn(ic('inbox')+'\u003cspan>\u003csmall>轉介入\u003c/small>\u003cb>人壽保險 &gt; 人壽保險\u003c/b>\u003c/span>','unavailable','','reftext')+customerLink(10)+'\u003csmall class=\"refmeta\">今天\u003cbr>轉介人: 吳婉婷(客戶經理)\u003c/small>'+btn(chevron()+'\u003cspan class=\"sr-only\">查看轉介\u003c/span>','unavailable','','arrowbtn')+'\u003c/article>').join('');\n}\nconst customerLink=i=>btn(person(i),'customer',i,'customerlink');\nfunction resources(){\n return ['市場資訊','優惠一覽表'].map((title,i)=>`\u003carticle class=\"resource\">\u003ci class=\"art ${i?'offers':'market'}\" aria-hidden=\"true\">\u003c/i>\u003cdiv>\u003ch3>${title}\u003c/h3>\u003csmall>更新日期: 2026/01/01\u003c/small>${btn('立即下載 '+ic('getfile',true),'download',i,'download')}\u003c/div>\u003c/article>`).join('');\n}\nfunction signalList(){\n return `\u003cdiv class=\"box\">${signals.map((s,i)=>btn(`\u003cspan>${h(s)}\u003c/span>\u003cspan>共 \u003cb>${totals[i]}\u003c/b> 位客戶\u003c/span>`,'signal',i,'listitem')).join('')}${state.page==='首頁'?btn('查看所有客盤動態','go', rySelector('[data-act=\"'+b.dataset.act+'\"][data-val=\"'+b.dataset.val+'\"]');\n  if(current){current.focus({preventScroll:true});showStarTip(current)}\n }\n return}const row=e.target.closest('.targets tbody tr,.sales-grid tbody tr,.box tbody tr');const control=row?.querySelector('[data-act=\"customer\"],[data-act=\"campaign\"]');if(control)withNavigation(()=>act(control.dataset.act,control.dataset.val))});\nfor(const type of ['input','change'])document.addEventListener(type,e=>{if(e.target.dataset.field)withNavigation(()=>updateField(e))});\n$('search').addEventListener('submit',e=>{e.preventDefault();const q=$('query').value.trim().toLowerCase();if(!q)return;const found=clientRows.findIndex(r=>r.slice(0,3).join(' ').toLowerCase().includes(q));if(found>=0)withNavigation(()=>customer(found))});\n$('modal').addEventListener('click',e=>{if(e.target!==$('modal'))return;const r=$('modal').getBoundingClientRect();if(e.clientX\u003cr.left||e.clientX>r.right||e.clientY\u003cr.top||e.clientY>r.bottom)withNavigation(close)});\nrender();\n// Store navigation state separately from confirmed records, stars, replies and allocations.\nconst routeFields=['page','customer','homeTab','salesTab','expanded','quarter','campaignIndex','listTab','expired','group','status','onlyStars','sort','teamFilter','teamStatus','teamStaff','allocation','newText','privacy','noteFilter'];\nfunction viewSnapshot(){\n const ui=Object.fromEntries(routeFields.map(k=>[k,state[k]]));\n const overlay=$('modal').open?$('modal').className||'filters':'';\n const tab=state.page==='客戶資料'?[cp.tab,cp.tab==='活動記錄'?cp.logTab:'',state.customer]:state.page==='首頁'?state.homeTab:state.page==='銷售線索'?state.salesTab:state.page==='行銷活動'?[state.listTab,state.quarter,state.campaignIndex]:null;\n const route=JSON.stringify([state.page,tab,overlay,overlay==='drawer'?noteId:null]);\n return structuredClone({route,ui,cp,draft,overlay,noteId,threadText,pick,appointment,productChoice,productGroup,scroll:scrollY,dialogScroll:$('modal').querySelector('.dlgcontent')?.scrollTop||0})\n}\nfunction sendView(type,before){\n const message={app:'contact-flow',type,before,after:viewSnapshot()};\n try{parent.receiveFlow(window,message)}\n catch(e){if(e.name!=='SecurityError')throw e;parent.postMessage(message,'*')}\n}\nfunction withNavigation(fn){const before=viewSnapshot();fn();sendView('change',before)}\nfunction restoreView(v){\n close();clearTimeout(toastTimer);$('toast').hidden=true;Object.assign(state,v.ui);Object.assign(cp,v.cp);draft=v.draft;noteId=v.noteId;threadText=v.threadText;pick=v.pick;appointment=v.appointment;productChoice=v.productChoice;productGroup=v.productGroup;\n render();\n switch(v.overlay){\n case 'drawer':showThread(noteId);break;\n case 'appointment':paintAppointment();break;\n case 'productdlg':paintProduct();break;\n case 'newnote':popup('新增附註',noteForm(),'','newnote');break;\n case 'filters':act('filters','');break;\n case 'staffdlg':chooseStaff();pick=v.pick;$('modal').querySelector('[data-field=\"staffQuery\"]').value=pick.query;paintRoster();break\n }\n window.scrollTo(0,v.scroll);const body=$('modal').querySelector('.dlgcontent');if(body)body.scrollTop=v.dialogScroll\n}\nwindow.addEventListener('message',e=>{if(e.source===parent&&e.data?.app==='restore-contact-flow')restoreView(e.data.view)});\n$('modal').addEventListener('cancel',e=>{e.preventDefault();withNavigation(close)});\nsendView('ready');\n\u003c/script>\u003c/body>\u003c/html>";
const tasks=[['1','星號客戶'],['2','附註'],['3a','我的銷售線索'],['3b','我的銷售線索'],['4','分配予指派人員']];
const frames=new Map(),latest=new Map(),ready=new Set();
const session=crypto.randomUUID();
let entries=[],position=0,active='';
function showTask(key){
 active=key;
 if(!frames.has(key)){
  const frame=document.createElement('iframe');
  frame.name='task'+key;
  frame.title=tasks.find(t=>t[0]===key).join(' ');
  frame.srcdoc=application;
  frames.set(key,frame);
  document.body.append(frame);
 }
 frames.forEach((f,k)=>{f.hidden=k!==key});
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.task===key?'true':'false'))
}
function push(key,view){
 entries.splice(position+1);
 position=entries.push({key,view})-1;
 history.pushState({session,position},'');
}
function choose(key){
 if(key===active)return;
 push(key,latest.get(key)||null);
 showTask(key)
}
function restore(){
 const {key,view}=entries[position];showTask(key);
 if(!view||!ready.has(key))return;
 latest.set(key,view);
 const child=frames.get(key).contentWindow;
 try{child.restoreView(structuredClone(view))}
 catch(e){if(e.name!=='SecurityError')throw e;child.postMessage({app:'restore-contact-flow',view},'*')}
}
window.addEventListener('popstate',e=>{
 if(e.state?.session===session && entries[e.state.position]){
  frames.forEach(f=>f.inert=false);position=e.state.position;restore()
 }
});
function receiveFlow(source,data){
 if(data?.app!=='contact-flow')return;
 const key=tasks.find(([key])=>frames.get(key)?.contentWindow===source)?.[0];
 if(!key)return;
 const {type,before,after}=data,entry=entries[position];
 if(type==='ready'){ready.add(key);if(key===active && entry.view){restore();return}}
 if(key!==active)return;
 latest.set(key,after);
 if(type!=='change'||!before||before.route===after.route){entry.view=after;return}
 entry.view=before;
 // Dismissing a dialog returns to its existing page entry with any confirmed edits.
 const previous=entries[position-1];
 if(before.overlay&&!after.overlay&&previous?.key===key&&previous.view?.route===after.route){
  previous.view=after;frames.get(key).inert=true;history.back();return
 }
 push(key,after)
}
window.addEventListener('message',e=>receiveFlow(e.source,e.data));
tasks.forEach(([key,name])=>{const b=document.createElement('button');b.dataset.task=key;b.textContent=key+' '+name;b.onclick=()=>choose(key);document.querySelector('#tabs').append(b)});
entries=[{key:'1',view:null}];history.replaceState({session,position},'');showTask('1');
function menu(hide){document.getElementById('bar').hidden=hide;document.getElementById('show').hidden=!hide;document.getElementById(hide?'show':'hide').focus()}
document.querySelector('#hide').onclick=()=>menu(true);document.querySelector('#show').onclick=()=>menu(false)
</script></html>
