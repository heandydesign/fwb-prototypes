<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FWB Tab Nav Menu Mockup (Dynamic Width)</title>
<style>
  :root {
    --teal: #1b8c7c; --teal-2: #3aab9a; --teal-soft: #dff3ee;
    --ink: #1f1f1f; --ink-2: #595959; --ink-3: #8c8c8c;
    --line: #e3e3e3; --bg: #f4f4f4; --side: #333; --red: #e5484d; --green: #2fb65a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans TC","PingFang HK","Microsoft JhengHei","Noto Sans",Arial,sans-serif;
    font-size: 13px; color: var(--ink); background: var(--bg); display: flex; min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 2px; }
  small, .unit { font-size: 10px; color: var(--ink-2); font-weight: 400; }
  .muted { color: var(--ink-3); }
  svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.3; flex-shrink: 0; vertical-align: -2px; }

  /* ---------- Side bar ---------- */
  .side { width: 72px; background: var(--side); color: #fff; flex-shrink: 0; display: flex; flex-direction: column;
    position: sticky; top: 0; left: 0; height: 100vh; align-self: flex-start; overflow-y: auto; z-index: 40; }
  .side .logo { padding: 14px 0 12px; text-align: center; font-size: 9px; line-height: 1.3; font-weight: 700; border-bottom: 1px solid #4a4a4a; }
  .side .item { padding: 12px 0; text-align: center; font-size: 10px; }
  .side .item.on { background: #474747; color: #6fd3c2; }
  .side svg { display: block; margin: 0 auto 4px; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .side .bottom { margin-top: auto; border-top: 1px solid #4a4a4a; }

  /* ---------- Top bar ---------- */
  .main { flex: 1; min-width: 1130px; display: flex; flex-direction: column; }
  .topbar { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px; position: sticky; top: 0; z-index: 31; background: var(--bg); }
  .topbar .title { font-size: 17px; font-weight: 700; }
  .topbar .spacer { flex: 1; }
  .search { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 4px; height: 32px; background: #fff; }
  .search .seg { padding: 0 10px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; gap: 8px; }
  .search .ph { padding: 0 10px; color: #bbb; width: 150px; }
  .search kbd { font: inherit; font-size: 9px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; margin-right: 4px; }
  .search .plus { border-left: 1px solid var(--line); height: 100%; width: 32px; display: grid; place-items: center; font-size: 18px; color: var(--ink-2); }
  .user { text-align: right; font-size: 12px; line-height: 1.3; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; }

  /* ---------- Tab nav + mega menu ---------- */
  .nav { position: sticky; top: 64px; z-index: 30; padding: 0 20px; background: var(--bg); }
  .tabs { display: flex; align-items: center; border-bottom: 1px solid #d5d5d5; }
  .tab { position: relative; height: 42px; padding: 0 13px; display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; }
  .tab.active, .tab.open { color: var(--teal); font-weight: 700; }
  .tab.active::after, .tab.open::after { background: var(--teal); }
  .tab .chev { width: 10px; height: 10px; fill: none; stroke: var(--ink); stroke-width: 1.6; transition: transform .15s; }
  .tab.open .chev { transform: rotate(180deg); }
  .tabs .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .mega { position: absolute; left: 20px; width: max-content; top: 100%; z-index: 20; background: #fff; box-shadow: 0 8px 16px rgba(0,0,0,.16); display: none; }
  .mega.show { display: grid; }  /* Dynamic width: N menu columns + quick links, all equal (set in renderMega) */
  .mega .cols { display: contents; }
  .mega .cols > div { padding: 22px 12px 26px 40px; }
  .mega .quick { padding-left: 36px !important; border-left: 1px solid var(--line); padding: 22px 24px 26px; }
  .mega .quick h6 { font-size: 11px; font-weight: 400; color: var(--ink-2); margin-bottom: 10px; }
  .group + .group { margin-top: 14px; }
  .l2 { display: block; font-size: 14px; font-weight: 700; padding: 3px 0; text-align: left; }
  span.l2 { cursor: default; }
  button.l2:hover, .l3:hover, .ql:hover { color: var(--teal); }
  .l3 { display: block; font-size: 13px; color: var(--ink-3); padding: 5px 0; text-align: left; }
  .l3.current, button.l2.current { color: var(--teal); font-weight: 700; }
  .ql { display: flex; align-items: center; gap: 8px; font-weight: 500; padding: 5px 0; }
  .ql svg { color: var(--teal); }

  /* ---------- Pills ---------- */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px 0; }
  .pills:empty { display: none; }
  .pill { border: 1px solid #cfcfcf; border-radius: 999px; padding: 5px 14px; font-weight: 700; color: var(--ink-2); }
  .pill:hover { border-color: var(--teal); color: var(--teal); }
  .pill.current { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }

  /* ---------- Generic blocks ---------- */
  .content { padding: 14px 20px 28px; flex: 1; }
  .layout { display: grid; gap: 16px; align-items: start; grid-template-columns: 280px minmax(0,1fr); }
  .layout.three { grid-template-columns: 280px minmax(0,1fr) 250px; }
  .stack > * + * { margin-top: 12px; }
  .card { background: #fff; border-radius: 6px; padding: 18px 20px; }
  .card.flush { padding: 0; }
  h2 { font-size: 20px; } h3 { font-size: 15px; } h4 { font-size: 14px; }
  .btn { border: 1px solid #d0d0d0; background: #fff; border-radius: 3px; padding: 5px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; vertical-align: middle; }
  td.r { white-space: nowrap; }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 700; }
  .btn.primary:hover { color: #fff; filter: brightness(1.08); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .num { font-size: 18px; font-weight: 500; }
  .label { color: var(--ink-3); font-size: 12px; margin-bottom: 4px; }
  .count { background: var(--teal-soft); color: var(--teal); border-radius: 8px; font-size: 10px; padding: 1px 6px; font-weight: 700; }
  .tag { display: inline-block; border-radius: 999px; padding: 2px 10px; background: #eee; font-size: 12px; font-weight: 500; }
  .tag.gold { background: #f1e4c4; color: #8a6a1d; }
  .tag.ok { background: #dcf5e3; color: #1f9d48; } .tag.bad { background: #fde1e0; color: #d93a35; }
  .tag.warn { background: #fdeed3; color: #c77a05; } .tag.teal { background: var(--teal-soft); color: var(--teal); }
  .tag.off { background: #f2f2f2; color: #c4c4c4; }
  .okdot { display: inline-grid; place-items: center; width: 13px; height: 13px; border-radius: 50%; background: var(--teal-2); color: #fff; font-size: 9px; vertical-align: -1px; }
  .okdot.no { background: #cfcfcf; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 700; color: var(--ink-2); padding: 10px 12px; border-bottom: 1px solid #d5d5d5; white-space: nowrap; }
  td { padding: 12px; vertical-align: middle; }
  tbody tr:nth-child(even) { background: #fafafa; }
  .r { text-align: right; }
  .pager { display: flex; align-items: center; gap: 16px; padding: 14px 16px; color: var(--ink-2); border-top: 1px solid var(--line); }
  .pager .pg { margin-left: auto; display: flex; gap: 18px; align-items: center; }
  .pager .cur { background: var(--teal-2); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
  .pager .box { width: 28px; height: 20px; border: 1px solid var(--line); border-radius: 3px; background: #fff; display: inline-block; vertical-align: middle; margin: 0 6px; }

  /* ---------- Customer profile panel ---------- */
  .profile { background: #fff; border-radius: 6px; }
  .profile section { padding: 18px 20px; border-top: 1px solid var(--line); }
  .profile section:first-child { border-top: 0; }
  .profile h4 { margin-bottom: 10px; }
  .who { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .who .pic { width: 42px; height: 42px; border-radius: 50%; background: #dccfa6; display: grid; place-items: center; color: #fff; }
  .who .pic svg { width: 26px; height: 26px; fill: #fff; }
  .who b { font-size: 17px; display: block; line-height: 1.2; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .btn.wide { width: 100%; justify-content: center; padding: 6px; }
  .kv { display: grid; grid-template-columns: 108px 1fr; gap: 7px 0; }
  .kv dt { color: var(--ink-3); font-size: 11px; align-self: center; }
  .contact { display: grid; grid-template-columns: 24px 1fr 16px; gap: 8px 6px; align-items: start; color: var(--ink-3); }
  .contact span { color: var(--ink); }

  /* ---------- Charts ---------- */
  .dist { display: flex; gap: 28px; align-items: flex-start; margin-top: 14px; }
  .pie { width: 210px; height: 210px; border-radius: 50%; flex-shrink: 0; }
  .dist table { flex: 1; }
  .dist td { padding: 9px 8px; } .dist tbody tr { background: none; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 12px; }
  .subtabs { display: grid; grid-template-columns: 1fr 1fr; background: #ebebeb; border-radius: 6px 6px 0 0; }
  .subtabs div { text-align: center; padding: 12px; font-size: 14px; font-weight: 700; color: var(--ink-3); border-bottom: 2px solid #d5d5d5; }
  .subtabs .on { background: #fff; color: var(--teal); border-bottom-color: var(--teal); border-radius: 6px 6px 0 0; }
  .list { border: 1px solid #eee; border-radius: 4px; margin-top: 12px; }
  .list .li { display: grid; grid-template-columns: 40px 1fr 110px 60px; align-items: center; padding: 12px 16px; }
  .list .li:nth-child(even) { background: #fafafa; }

  /* ---------- Right-hand accordions ---------- */
  details.acc { background: #fff; border-radius: 6px; }
  details.acc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 14px 16px; font-size: 14px; font-weight: 700; }
  details.acc > summary::-webkit-details-marker { display: none; }
  details.acc > summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 1.6px solid var(--ink); border-bottom: 1.6px solid var(--ink); transform: rotate(45deg); }
  details.acc[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
  details.acc > summary .btn { margin-left: auto; font-weight: 400; }
  details.acc > summary .btn + * , details.acc > summary:has(.btn)::after { margin-left: 8px; }
  .acc .it { padding: 10px 16px; border-top: 3px solid var(--bg); }
  .acc .it b { display: block; font-weight: 500; }
  .acc .al { display: grid; grid-template-columns: 30px 1fr; padding: 10px 16px; border-top: 1px solid #eee; align-items: center; }
  .acc .al b { font-weight: 500; display: block; } .acc .al small { font-size: 9px; }
  .acc .body { padding: 4px 16px 14px; color: var(--ink-3); }
  .tick { color: var(--green); font-size: 15px; } .cross { color: var(--red); font-size: 15px; }

  /* ---------- Fund accounts ---------- */
  details.acct { background: #fff; border: 1px solid #e6e6e6; border-radius: 8px; }
  details.acct > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr 1fr 24px; align-items: center; padding: 14px 20px; }
  details.acct > summary::-webkit-details-marker { display: none; }
  details.acct > summary > div + div { border-left: 1px solid var(--line); padding-left: 14px; }
  details.acct > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.6px solid var(--ink); border-bottom: 1.6px solid var(--ink); transform: rotate(45deg); }
  details.acct[open] > summary::after { transform: rotate(-135deg); }
  details.acct .inner { background: #fafafa; padding: 20px; border-radius: 0 0 8px 8px; }
  .up { color: var(--green); } .down { color: var(--red); }
  .toggle { width: 34px; height: 18px; border-radius: 9px; background: #ddd; position: relative; display: inline-block; }
  .toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }

  /* ---------- Portfolio analysis ---------- */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mini { min-height: 110px; }
  .mini .hd, .lst .hd { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; margin-bottom: 18px; }
  .mini .hd::after { content: "›"; margin-left: auto; font-weight: 400; font-size: 16px; }
  .lst { padding: 0 0 18px; } .lst .hd { padding: 16px 16px 0; }
  .lst .ln { display: flex; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #e2e2e2; font-size: 11px; font-weight: 500; }
  .stackbar { width: 44px; height: 46px; display: flex; flex-direction: column; margin-left: auto; }
  .filter { border: 1px solid var(--line); background: #fff; border-radius: 3px; padding: 6px 10px; width: 140px; color: #bbb; display: inline-flex; justify-content: space-between; }
  .placeholder { min-height: 280px; display: grid; place-items: center; border: 1px dashed #cfcfcf; border-radius: 6px; background: #fafafa; color: var(--ink-3); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 4px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
</style>
</head>

const ICONS = {
  download: '<path d="M7 2v7M4 6.500L7 9.500l3-3M2.500 11.500h9"/>',
  edit: '<rect x="2" y="2" width="10" height="10" rx="1.500"/><path d="M5 8.500l1.800-.3L10 5 9 4 5.800 7.200z"/>',

        <svg width="70" height="34" viewBox="0 0 70 34" fill="none" stroke="#999"><path d="M2 32l6-12 4 6 6-16 5 12 5-8 5 9 6-12 5 8 6-6 5 3 6-6"/><circle cx="64" cy="11" r="1.500" fill="#b3002d" stroke="none"/></svg></div></div>
      <div class="card flush lst"><div class="hd">Top 5 最大波動性的產品</div>${mov.map(u => `<div class="ln"><span>貝萊德亞太股票入息基金</span><span class="${u ? "up" : "down"}" style="font-size:9px">${u ? "▴" : "▾"} <span class="muted">24.10%</span></span></div>`).join("")}</div>
      <div class="card flush lst"><div class="hd">即將到期產品<span style="margin-left:auto;font-size:11px;font-weight:400">查看全部 &nbsp;›</span></div>${mov.map(() => `<div class="ln"><span>貝萊德亞太股票入息基金</span><span>2026/12/16</span></div>`).join("")}</div>
    </div>
    <div class="muted" style="text-align:center;margin-top:36px;font-size:11px">數據更新: 2026/09/28 13:12</div>
  </div>
  <div class="stack">${health()}
    <details class="acc" open><summary>投資組合特徵</summary><div class="body" style="border-top:3px solid var(--bg);padding-top:10px">
      <table style="font-size:10px"><thead><tr><th style="border:0;padding:4px"></th><th class="r" style="border:0;padding:4px;font-weight:400">現時</th><th class="r" style="border:0;padding:4px;font-weight:400">基準</th></tr></thead><tbody>
      ${[["平均存續期 (年)", "0.44", "1.22"], ["平均淨費用比率 (%)", "0.27", "0.00"], ["過去12個月平均收益率 (%)", "2.60", "0.84"]].map(r => `<tr style="background:none"><td style="padding:4px 0">${r[0]}</td><td class="r" style="padding:4px;color:var(--ink)">${r[1]}</td><td class="r" style="padding:4px;color:var(--ink)">${r[2]}</td></tr>`).join("")}
      </tbody></table></div></details>
  </div></div>`;
}

/* Designed screens, keyed by "tabIndex|Level2|Level3". Anything else falls back to a placeholder. */
const PAGES = {
  "0": pgOverview,
  "1|投資|投資概覽": pgInvOverview,
  "1|投資|基金": pgFund,
  "3|聯絡記錄|電話/面談": pgContact,
  "4|銷售流程|壽險銷售": pgLifeSales,
  "4|投資組合分析及建議|投資組合概覽": pgPortfolio
};

/* ====== Navigation ====== */
const $ = id => document.getElementById(id);
const tabsEl = $("tabs"), megaEl = $("mega"), navEl = $("nav");
let current = { tab: 0, l2: null, l3: null };       // default landing: 客戶概覽
let openTab = null, closeTimer = null;

function findGroup(tab, l2) {
  for (const col of MENU[tab].cols || []) for (const g of col) if (g.label === l2) return g;
  return null;
}
function tabLabel(i) {
  const t = MENU[i];
  if (i !== current.tab || !current.l2) return t.label;   // every Level 2 section shows as「Tab：Level 2」
  const g = findGroup(i, current.l2);
  return `${t.label}：${g.short || g.label}`;
}
function renderTabs() {
  tabsEl.innerHTML = MENU.map((t, i) => `
    <button class="tab ${i === current.tab ? "active" : ""}" data-tab="${i}" ${t.cols ? 'aria-haspopup="true" aria-expanded="false"' : ""}>${tabLabel(i)}${t.cols ? CHEV : ""}</button>`).join("") +
    `<div class="right">${current.tab === 0 ? '<button class="btn primary" style="padding:7px 14px" data-toast="建立活動記錄">＋ 建立活動記錄</button>' : ""}
     <button title="重新整理" aria-label="重新整理"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.500 8a5.500 5.500 0 0 1-9.500 3.800M2.500 8A5.500 5.500 0 0 1 12 4.200M12.500 1.500v3h-3M3.500 14.500v-3h3"/></svg></button></div>`;
}
function renderMega(i) {
  const t = MENU[i];
  const isCur = (l2, l3) => current.tab === i && current.l2 === l2 && current.l3 === (l3 || null);
  megaEl.style.gridTemplateColumns = `repeat(${t.cols.length}, 240px) 232px`;   // column widths per PDF: menu 240px, 快速連結 232px
  megaEl.innerHTML = `
    <div class="cols" style="grid-template-columns:repeat(${t.cols.length},1fr)">
      ${t.cols.map(col => `<div>${col.map(g => `<div class="group">
          ${g.children
            ? `<span class="l2">${g.label}</span>` + g.children.map(c => `<button class="l3 ${isCur(g.label, c) ? "current" : ""}" data-l2="${g.label}" data-l3="${c}">${c}</button>`).join("")
            : `<button class="l2 ${isCur(g.label) ? "current" : ""}" data-l2="${g.label}">${g.label}</button>`}
        </div>`).join("")}</div>`).join("")}
    </div>
    <div class="quick"><h6>快速連結</h6>${t.quick.map(q => `<button class="ql" data-toast="${q.label}">${I(q.icon)}${q.label}</button>`).join("")}</div>`;
}
function setOpen(i) {
  tabsEl.querySelectorAll(".tab").forEach((b, n) => {
    b.classList.toggle("open", n === i);
    if (b.hasAttribute("aria-expanded")) b.setAttribute("aria-expanded", n === i);
  });
}
function open(i) {
  clearTimeout(closeTimer);
  if (!MENU[i].cols) return close();
  if (openTab === i) return;
  openTab = i; renderMega(i); megaEl.classList.add("show"); setOpen(i); placeMega(i);
}
/* Align the dropdown to the left edge of its tab; shift left only if it would overflow the tab bar's right edge */
function placeMega(i) {
  const tab = tabsEl.querySelectorAll(".tab")[i];
  const maxLeft = navEl.clientWidth - 20 - megaEl.offsetWidth;
  megaEl.style.left = Math.max(20, Math.min(tab.offsetLeft, maxLeft)) + "px";
}
window.addEventListener("resize", () => { if (openTab !== null) placeMega(openTab); });
function close() { clearTimeout(closeTimer); openTab = null; megaEl.classList.remove("show"); setOpen(-1); }
const scheduleClose = () => { clearTimeout(closeTimer); closeTimer = setTimeout(close, 180); };

function renderPage() {
  const g = current.l3 ? findGroup(current.tab, current.l2) : null;
  $("pills").innerHTML = g ? g.children.map(c => `<button class="pill ${c === current.l3 ? "current" : ""}" data-l3="${c}">${c}</button>`).join("") : "";
  const key = [current.tab, current.l2, current.l3].filter(x => x !== null).join("|");
  const name = current.l3 || current.l2 || MENU[current.tab].label;
  $("content").innerHTML = PAGES[key] ? PAGES[key]()
    : `<div class="layout">${profile()}<div class="placeholder">「${name}」頁面內容（Placeholder）</div></div>`;
  window.scrollTo(0, 0);
}
function go(tab, l2, l3) { current = { tab, l2: l2 || null, l3: l3 || null }; close(); renderTabs(); renderPage(); }
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600);
}

/* ---- Events ---- */
const tabOf = e => e.target.closest(".tab");
tabsEl.addEventListener("mouseover", e => { const b = tabOf(e); if (b) open(+b.dataset.tab); });
tabsEl.addEventListener("focusin", e => { const b = tabOf(e); if (b) open(+b.dataset.tab); });
tabsEl.addEventListener("click", e => {
  const b = tabOf(e); if (!b) return;
  const i = +b.dataset.tab;
  if (!MENU[i].cols) go(i); else open(i);     // tab without dropdown navigates directly
});
navEl.addEventListener("mouseleave", scheduleClose);
navEl.addEventListener("mouseenter", () => clearTimeout(closeTimer));
navEl.addEventListener("focusout", e => { if (!navEl.contains(e.relatedTarget)) scheduleClose(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
megaEl.addEventListener("click", e => { const b = e.target.closest("[data-l2]"); if (b) go(openTab, b.dataset.l2, b.dataset.l3); });
$("pills").addEventListener("click", e => { const p = e.target.closest(".pill"); if (p) go(current.tab, current.l2, p.dataset.l3); });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-toast]"); if (!t) return;
  e.preventDefault(); toast(t.dataset.toast); close();
});

renderTabs(); renderPage();
</script>
</body>
</html>
